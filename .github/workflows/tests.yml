name: tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || ! github.event.pull_request.draft

    # `composer setup` copies .env.example and runs `migrate --force`, and
    # .env.example points at the local Postgres, which no runner has. These override
    # it for that one step. The test run itself is unaffected either way: phpunit.xml
    # pins the same two values, which is what keeps this workflow free of a database
    # service container.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          # composer.json requires ext-redis, and setup-php's default set does not
          # include it, so `composer install` fails the platform check without this.
          # pcntl comes from laravel/horizon and is built into the php-cli builds
          # setup-php installs; it is named anyway so the requirement is visible.
          extensions: pcntl, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
