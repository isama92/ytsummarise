# The workflow name is load-bearing. autofix.ci refuses to run unless the workflow
# using its action is called exactly "autofix.ci", so that a pull request cannot rename
# some other workflow into one the app is willing to push commits from.
#
# That check is also why this file holds nothing but the formatters. Static analysis
# lives in code-quality.yml: the less that runs under the name autofix.ci trusts, the
# smaller the surface that can push back onto a branch.
name: autofix.ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Deliberately read-only. autofix.ci pushes through its own GitHub App, not through
# this token, and granting write here would defeat the point of the app.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rector, Pint and Prettier all rewrite files, so this job fixes rather than
  # complains and hands the result to autofix.ci to commit back onto the branch.
  #
  # REQUIRES the autofix.ci GitHub App to be installed on this repository
  # (https://github.com/apps/autofix-ci). Without it the formatters still run and the
  # job still passes, but nothing is ever pushed - the fixes are silently discarded.
  autofix:
    name: Format and refactor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Draft PRs are still being written; formatting them just adds noise to a diff
    # the author is not finished with.
    if: github.event_name != 'pull_request' || ! github.event.pull_request.draft

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # composer.json requires ext-redis, and setup-php's default set does not
          # include it, so `composer install` fails the platform check without this.
          # pcntl comes from laravel/horizon and is built into the php-cli builds
          # setup-php installs; it is named anyway so the requirement is visible.
          extensions: pcntl, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      # Both tools are incremental. The key includes the SHA so every run writes a
      # fresh entry, and restore-keys falls back to the newest previous one.
      - name: Cache formatting results
        uses: actions/cache@v6
        with:
          path: |
            .pint.cache
            /tmp/rector/cache
          key: ${{ github.repository }}-autofix-${{ github.sha }}
          restore-keys: |
            ${{ github.repository }}-autofix-

      # Rector before Pint: Rector rewrites syntax and cares nothing for formatting,
      # so Pint has to run over its output rather than the other way round.
      - name: Run Rector
        run: composer ci:refactor

      - name: Run Pint
        run: composer ci:lint

      - name: Run Prettier
        run: npm run format

      - name: Commit any fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          commit-message: '[autofix.ci] Apply code formatting fixes'
