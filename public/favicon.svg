<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!--
        The same mark as resources/js/components/app-logo-icon.tsx, on a tile. Keep the
        two in step.

        A tile rather than a bare glyph because this renders at 16px against browser
        chrome the page has no say over, and a thin monochrome mark disappears there.
        The colours are fixed for the same reason: a favicon gets no CSS from the page,
        so it cannot follow the flavour. Rosewater is the app's primary and the one
        mid-tone that reads against both `base` values, which is why the Inertia
        progress bar in resources/js/app.tsx hardcodes it too.

        favicon.ico and apple-touch-icon.png are rasterised from this file.
    -->
    <rect width="64" height="64" rx="14" fill="#dc8a78"/>

    <g transform="translate(1.58 2.3) scale(1.484)" fill="#4c4f69">
        <path d="M5 8.4A2.2 2.2 0 0 1 8.4 6.5L19.8 18.2a2.5 2.5 0 0 1 0 3.6L8.4 33.5A2.2 2.2 0 0 1 5 31.6Z"/>
        <rect x="25" y="13" width="11" height="3.6" rx="1.8"/>
        <rect x="25" y="19.7" width="11" height="3.6" rx="1.8"/>
        <rect x="25" y="26.4" width="7" height="3.6" rx="1.8"/>
    </g>
</svg>
