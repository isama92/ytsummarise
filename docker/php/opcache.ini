; Production opcache settings. The base image ships opcache compiled in but leaves
; it unconfigured, and installs no php.ini at all - the Dockerfile copies
; php.ini-production into place, and this file layers on top of it.
;
; validate_timestamps=0 is the one that matters and the one that would be wrong
; anywhere else: it stops PHP stat()-ing every file on every request. The image is
; immutable and a deploy replaces the container, so there is nothing to revalidate.
; The flip side is that editing a file inside a running container has no effect
; until it restarts.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
; Comfortably above the ~8k files a Laravel app plus vendor actually loads, so the
; cache never starts evicting - an evicting opcache is slower than none at all.
opcache.max_accelerated_files=20000
; Left on: some packages still read docblocks at runtime, and the memory saved by
; stripping them is not worth debugging a reflection failure in production.
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
